aid: runsignup
name: RunSignup
description: >-
  RunSignup is an all-in-one race registration and event management platform serving running events, triathlons, cycling
  events, and obstacle courses. Their open REST API enables race directors, timing companies, affiliates, and technology
  partners to integrate race registration, participant management, results posting, fundraising, volunteer management,
  and event analytics into their own applications. The API supports OAuth 2.0 authentication and covers 100+ endpoints
  across 29 categories for comprehensive event lifecycle management.
